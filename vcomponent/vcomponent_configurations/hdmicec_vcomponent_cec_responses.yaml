hdmicec:
  cec_messages:
    - request: { opcode: 0x04, type: "Direct", payload: null}   # Image View on
      response: null
    - request: { opcode: 0x0D, type: "Direct", payload: null}   # Text View On
      response: null
    - request: { opcode: 0x32, type: "Broadcast", payload: null}   # Set Menu Language
      response: null
    - request: { opcode: 0x36, type: "Direct", payload: null}   # Standy
      response: null
    - request: { opcode: 0x47, type: "Direct", payload: null}   # report OSD Name
      response: null
    - request: { opcode: 0x64, type: "Direct", payload: null}   # Set OSD String
      response: null
    - request: { opcode: 0x82, type: "Broadcast", payload: null}   # Active source
      response: null
    - request: { opcode: 0x84, type: "Broadcast", payload: null}   # Report Physical address
      response: null
    - request: { opcode: 0x87, type: "Broadcast", payload: null}   # Device Vendor ID
      response: null
    - request: { opcode: 0x90, type: "Direct", payload: null}   # Power Status
      response: null
    - request: { opcode: 0x9E, type: "Direct", payload: null}   # CEC Version
      response: null
    - request: { opcode: 0xA8, type: "Direct", payload: null}   # Report Physical Address
      response: null
    - request: { opcode: 0x46, type: "Direct", payload: null} # Give OSD Name
      response: { opcode: 0x47, type: "Direct", payload: ["osd_name"]}
    - request: { opcode: 0x83, type: "Direct", payload: null} # Give Physical Address
      response: { opcode: 0x84, type: "Broadcast", payload: ["physical_address", "device_type"]}
    - request: { opcode: 0x85, type: "Broadcast", payload: null} # Request Active source
      response: { opcode: 0x82, type: "Broadcast", payload: ["physical_address"]}
    - request: { opcode: 0x8C, type: "Direct", payload: null} # Give Vendor ID
      response: { opcode: 0x87, type: "Direct", payload: ["vendor_id"]}
    - request: { opcode: 0x8F, type: "Direct", payload: null} # Give power status
      response: { opcode: 0x90, type: "Direct", payload: ["power_status"]}
    - request: { opcode: 0x91, type: "Direct", payload: null} # Get Menu Language
      response: { opcode: 0x32, type: "Broadcast", payload: ["language"]}
    - request: { opcode: 0x9F, type: "Direct", payload: null} # Get CEC version
      response: { opcode: 0x9E, type: "Direct", payload: ["cec_version"]}
    - request: { opcode: 0xA7, type: "Broadcast", payload: null} # Request Latency
      response: { opcode: 0xA8, type: "Broadcast", payload: ["latency"]}