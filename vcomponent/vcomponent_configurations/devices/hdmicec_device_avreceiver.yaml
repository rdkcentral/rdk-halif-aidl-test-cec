hdmicec:
  device:
    - name: "AVReceiver"
      language: "eng"
      cec_version: 0x05
      logical_address: 5
      physical_address: [0x30, 0x00] #"3.0.0.0"
      vendor_id: "0x00009E"       # Onkyo
      device_type: 5 # 0 - "TV"
                     # 1 - "Recording Device"
                     # 2 - "Reserved"
                     # 3 - "Tuner"
                     # 4 - "Playback device"
                     # 5 - "Audio System"
      power_status: 0x00 # 0x00 - on
                         # 0x01 - Standby
                         # 0x02 - In transition Standby to On
                         # 0x03 - In transition On to Standby
      fault: 0x1   # 0x0 - no fault
                   # 0x1 - Partial fault
                   # 0x2 - faulty device