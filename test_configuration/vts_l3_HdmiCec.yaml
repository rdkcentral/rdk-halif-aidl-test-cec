HdmiCec:
  L3:
    SendMessage:
      source_logical_address: [0] # Logical address of the DUT
      delay_between_messages: 10 # Delay between messages in milliseconds
      cec_messages:
        - Parameters:
            message: [0x05, 0x46] # Message to be sent with payload (0x46 = "Give OSD Name")
          Expected_Results:
            metrics:
              directedMessagesSent: 1
              directedMessagesSentAndAcked: 1
              broadcastMessagesSent: 0
              broadcastMessagesSentAndAcked: 0
              arbitrationFailures: 0
        - Parameters:
            message: [0x05, 0x85] # Message to be sent with payload (0x85 = "Request Active Source")
          Expected_Results:
            metrics:
              directedMessagesSent: 0
              directedMessagesSentAndAcked: 0
              broadcastMessagesSent: 1
              broadcastMessagesSentAndAcked: 1
              arbitrationFailures: 0
    ReceiveMessage:
    - Parameters:
        message: ["0x50", '0x47', '0x52', '0x44', '0x4B', '0x20', '0x76', '0x44', '0x65',
          '0x76', '0x69', '0x63', '0x65', '0x20', '0x54', '0x56']
        logical_address: ['0']
        wait_for_response_timeout: 50000

