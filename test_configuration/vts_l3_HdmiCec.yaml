HdmiCec:
  L3:
    SendMessage:
      source_logical_address: [0] # Logical address of the DUT
      delay_between_messages: 100 # Delay between messages in milliseconds
      cec_messages:
        - Parameters:
            destination: 5 # Logical address of the target device
            message: [0x46] # Message to be sent with payload (0x46 = "Give OSD Name")
          Controls:
            wait_for_response_timeout: 1000 # Time to wait for a response in milliseconds
          Expected_Results:
            onMessageSent: 0 # Expected result after sending the message
            onMessageReceived: [0x50, 0x47, 0x59, 0x41, 0x4D, 0x41, 0x48, 0x41] # Expected response message (OSD name)
            metrics:
              directedMessagesSent: 1
              directedMessagesSentAndAcked: 1
              broadcastMessagesSent: 0
              broadcastMessagesSentAndAcked: 0
              arbitrationFailures: 0
        - Parameters:
            destination: 0xF # broadcast message
            message: [0x85] # Message to be sent with payload (0x85 = "Request Active Source")
          Controls:
            wait_for_response_timeout: 1000 # Time to wait for a response in milliseconds
          Expected_Results:
            onMessageSent: 1 # Expected result after sending the message
            onMessageReceived: [0x5F, 0x82, 0x30, 0x00] # Expected response message (Physical address)
            metrics:
              directedMessagesSent: 0
              directedMessagesSentAndAcked: 0
              broadcastMessagesSent: 1
              broadcastMessagesSentAndAcked: 1
              arbitrationFailures: 0
    ReceiveMessage:
      - Parameters:
        logical_address: [0]
        message: [0x50, 0x9E, 0x05]
        wait_for_response_timeout: 5000 #Wait for the response time
      - Parameters:
        logical_address: []
        message: [0x50, 0x9E, 0x05]
        wait_for_response_timeout: 5000
